<!doctype html>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050608; }
  body { padding: 24px; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .caption { font: 600 11px/1 system-ui; letter-spacing: .13em; text-transform: uppercase; color: #5A6070; margin: 0 0 9px 2px; }
  .caption b { color: #A8AFBE; }
  .note { font: 400 11.5px/1.55 system-ui; color: #565D6B; margin: 8px 2px 32px; max-width: 900px; }
  .app { width: 920px; height: 500px; display: flex; overflow: hidden; border-radius: 9px; position: relative; }
  .amb { position: absolute; top: 0; left: 0; height: 2px; z-index: 3; }
  .side { flex: none; display: flex; flex-direction: column; }
  .mk { flex: none; } .mk svg { width: 100%; height: 100%; display: block; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .grow { flex: 1; }
  .row { display: flex; align-items: center; }
</style>
<body>
  <div id="out"></div>
  <script src="mark.js"></script>
  <script>
    const WS = [["SE learning",41],["Advanced Python",2],["DAE",18],["AI/ML",27],
                ["Data Science",9],["Maths",12],["Entertainment",22],["Stats",4]];
    const depth = (h) => Math.max(0.16, Math.min(1, Math.log1p(h) / Math.log1p(45)));
    const RES = [
      ["OOP Book (Thet Khaing)", "Calibre Library \\ Thet Khaing \\ Object-Oriented-Programming.pdf", "PDF"],
      ["Design Patterns", "refactoring.guru/design-patterns/catalog", "WEB"],
      ["Designing Data-Intensive Apps", "Calibre Library \\ designing-data-intensive.pdf", "PDF"],
      ["Course repo", "C:\\src\\se-learning", "DIR"],
      ["Lecture recordings", "drive.google.com/drive/folders/se-2026", "WEB"],
    ];
    const SCR = [["Sync notes to Drive","PS"],["Rebuild flashcards","PY"]];

    /* ───────────────────────── A · DEEP FIELD ─────────────────────────
       Idea: the app is tinted by the context you are inside. Accent hue comes
       from the workspace; saturation and lightness stay pinned.            */
    function deepField() {
      const t = { void:"#0A0C10", surf:"#0E1117", card:"#141922", ink:"#E9E7E2",
                  mut:"#8A90A0", fai:"#555C6B", rule:"rgba(255,255,255,.07)",
                  ac:"oklch(0.74 0.09 248)", soft:"oklch(0.74 0.09 248 / .14)" };
      const ws = WS.map(([n,h],i)=>{const on=i===0;return `
        <div class="row" style="gap:11px;padding:7px 9px;border-radius:7px;background:${on?t.soft:"transparent"}">
          <div class="mk" style="width:21px;height:21px;color:${on?t.ac:t.mut}">${constellation(n,depth(h),21)}</div>
          <div style="flex:1;font-size:12.5px;color:${on?t.ink:t.mut};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div>
          <div style="font-size:10px;color:${t.fai};font-variant-numeric:tabular-nums">${h}h</div>
        </div>`;}).join("");
      const res = RES.map(([a,b,k])=>`
        <div style="background:${t.card};border:1px solid ${t.rule};border-radius:7px;padding:10px 12px;display:flex;align-items:center;gap:12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:12.5px;color:${t.ink};margin-bottom:2px">${a}</div>
            <div style="font-size:10.5px;color:${t.fai};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b}</div>
          </div>
          <div style="font-size:9px;letter-spacing:.09em;color:${t.mut}">${k}</div>
          <div style="font-size:11px;color:${t.ac};padding:3px 9px;border:1px solid ${t.ac};border-radius:5px;opacity:.8">Launch</div>
        </div>`).join("");
      return `<div class="app" style="background:${t.void}">
        <div class="amb" style="background:${t.ac};width:61%;opacity:.7"></div>
        <div class="side" style="width:228px;background:${t.surf};border-right:1px solid ${t.rule};padding:0 9px 10px">
          <div class="row" style="height:46px;padding:0 9px;gap:9px;font-size:11px;letter-spacing:.2em;font-weight:600;color:${t.ink}">
            <span style="color:${t.ac}">✦</span>ORION<span style="margin-left:auto;letter-spacing:0;font-size:10px;color:${t.fai}">12</span></div>
          ${ws}</div>
        <div class="main">
          <div class="row" style="height:46px;padding:0 20px;gap:11px;border-bottom:1px solid ${t.rule}">
            <div style="font-size:15px;font-weight:600;color:${t.ink}">SE learning</div>
            <div style="font-size:11px;color:${t.fai}">41h 12m total</div>
            <div style="margin-left:auto;font:500 13px/1 ui-monospace,Consolas,monospace;color:${t.ink};font-variant-numeric:tabular-nums">14:29</div>
            <div style="font-size:10px;color:${t.ac}">■</div>
          </div>
          <div style="padding:14px 20px;display:flex;flex-direction:column;gap:7px">${res}</div>
          <div style="padding:2px 20px 0;display:flex;gap:8px">
            ${SCR.map(([s,k])=>`<div style="font-size:11px;color:${t.mut};background:${t.card};border:1px solid ${t.rule};border-radius:6px;padding:6px 11px">▸ ${s}</div>`).join("")}
          </div>
        </div></div>`;
    }

    /* ───────────────────────── B · EMBER ──────────────────────────────
       Idea: editorial. A display serif, generous measure, rules not boxes.
       Reads like a page you sit down with.                                */
    function ember() {
      const t = { void:"#14110F", surf:"#191513", ink:"#F2EBE1", mut:"#9C9187",
                  fai:"#6A5F56", rule:"rgba(255,240,225,.09)", ac:"#D07C43" };
      const ws = WS.map(([n,h],i)=>{const on=i===0;return `
        <div class="row" style="gap:12px;padding:8px 4px;border-bottom:1px solid ${on?"transparent":t.rule}">
          <div class="mk" style="width:20px;height:20px;color:${on?t.ac:t.fai}">${constellation(n,depth(h),20)}</div>
          <div style="flex:1;font-size:13px;color:${on?t.ink:t.mut};font-weight:${on?600:400};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div>
          <div style="font-size:10px;color:${t.fai};font-variant-numeric:tabular-nums">${h}</div>
        </div>`;}).join("");
      const res = RES.map(([a,b,k])=>`
        <div style="padding:11px 0;border-bottom:1px solid ${t.rule};display:flex;align-items:baseline;gap:14px">
          <div style="font:400 15px/1.25 Fraunces,Georgia,serif;color:${t.ink};flex:none;max-width:290px">${a}</div>
          <div style="flex:1;font-size:10.5px;color:${t.fai};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b}</div>
          <div style="font-size:9px;letter-spacing:.11em;color:${t.mut}">${k}</div>
        </div>`).join("");
      return `<div class="app" style="background:${t.void}">
        <div class="amb" style="background:${t.ac};width:61%;opacity:.8"></div>
        <div class="side" style="width:236px;background:${t.surf};border-right:1px solid ${t.rule};padding:0 16px 10px">
          <div class="row" style="height:52px;font:600 13px/1 Fraunces,Georgia,serif;letter-spacing:.04em;color:${t.ink}">
            Orion<span style="margin-left:auto;font-family:system-ui;font-size:10px;color:${t.fai}">twelve</span></div>
          ${ws}</div>
        <div class="main" style="padding:0 26px">
          <div style="padding:26px 0 16px;border-bottom:1px solid ${t.rule}">
            <div style="font:600 27px/1.1 Fraunces,Georgia,serif;color:${t.ink};letter-spacing:-.015em">SE learning</div>
            <div class="row" style="gap:12px;margin-top:7px">
              <div style="font-size:11px;color:${t.fai}">41 hours 12 minutes invested</div>
              <div style="margin-left:auto;font:400 18px/1 Fraunces,Georgia,serif;color:${t.ac};font-variant-numeric:tabular-nums">14:29</div>
            </div>
          </div>
          ${res}
          <div class="row" style="gap:16px;padding-top:13px">
            ${SCR.map(([s])=>`<div style="font-size:11.5px;color:${t.mut};border-bottom:1px solid ${t.ac}55;padding-bottom:2px">${s}</div>`).join("")}
          </div>
        </div></div>`;
    }

    /* ───────────────────────── C · ALMANAC ────────────────────────────
       Idea: technical and dense. Monospaced, achromatic, tight rows. More on
       screen at once, which suits a 1280x752 laptop panel.                */
    function almanac() {
      const t = { void:"#0B0D11", surf:"#0F1217", ink:"#EBEAE6", mut:"#848994",
                  fai:"#4F555F", rule:"rgba(255,255,255,.055)", hl:"#171C24" };
      const M = 'IBM Plex Mono,ui-monospace,Consolas,monospace';
      const ws = WS.map(([n,h],i)=>{const on=i===0;return `
        <div class="row" style="gap:10px;padding:4.5px 9px;background:${on?t.hl:"transparent"};border-left:2px solid ${on?t.ink:"transparent"}">
          <div class="mk" style="width:18px;height:18px;color:${on?t.ink:t.fai}">${constellation(n,depth(h),18)}</div>
          <div style="flex:1;font:400 11.5px/1 ${M};color:${on?t.ink:t.mut};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n}</div>
          <div style="font:400 10px/1 ${M};color:${t.fai}">${String(h).padStart(3)}h</div>
        </div>`;}).join("");
      const res = RES.map(([a,b,k])=>`
        <div class="row" style="gap:12px;padding:5.5px 0;border-bottom:1px solid ${t.rule}">
          <div style="font:400 9px/1 ${M};color:${t.fai};width:26px">${k}</div>
          <div style="font:400 12px/1 ${M};color:${t.ink};flex:none;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a}</div>
          <div style="flex:1;font:400 10px/1 ${M};color:${t.fai};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b}</div>
          <div style="font:400 10px/1 ${M};color:${t.mut}">↗</div>
        </div>`).join("");
      return `<div class="app" style="background:${t.void}">
        <div class="amb" style="background:${t.ink};width:61%;opacity:.45"></div>
        <div class="side" style="width:218px;background:${t.surf};border-right:1px solid ${t.rule};padding-bottom:8px">
          <div class="row" style="height:40px;padding:0 11px;font:500 10.5px/1 ${M};letter-spacing:.2em;color:${t.ink};border-bottom:1px solid ${t.rule}">
            ORION<span style="margin-left:auto;letter-spacing:0;color:${t.fai}">[12]</span></div>
          <div style="padding:7px 0">${ws}</div></div>
        <div class="main">
          <div class="row" style="height:40px;padding:0 18px;gap:12px;border-bottom:1px solid ${t.rule}">
            <div style="font:500 12.5px/1 ${M};color:${t.ink};letter-spacing:.01em">SE learning</div>
            <div style="font:400 10px/1 ${M};color:${t.fai}">41:12:00</div>
            <div style="margin-left:auto;font:500 13px/1 ${M};color:${t.ink}">14:29</div>
            <div style="font:400 9px/1 ${M};color:${t.fai}">POMO</div>
          </div>
          <div style="padding:10px 18px">
            <div style="font:400 8.5px/1 ${M};letter-spacing:.2em;color:${t.fai};padding-bottom:7px">RESOURCES · 5</div>
            ${res}
            <div style="font:400 8.5px/1 ${M};letter-spacing:.2em;color:${t.fai};padding:14px 0 7px">SCRIPTS · 2</div>
            ${SCR.map(([s,k])=>`<div class="row" style="gap:12px;padding:5px 0;border-bottom:1px solid ${t.rule}">
              <div style="font:400 9px/1 ${M};color:${t.fai};width:26px">${k}</div>
              <div style="font:400 12px/1 ${M};color:${t.ink}">${s}</div>
              <div style="margin-left:auto;font:400 10px/1 ${M};color:${t.mut}">run</div></div>`).join("")}
          </div>
        </div></div>`;
    }

    const items = [
      ["A","Deep field", deepField(),
       "The app is tinted by the context you are inside: the accent takes its HUE from the active workspace's colour, with saturation and lightness pinned so no workspace can ever look garish. Switching context visibly changes the room. Keeps light cards and explicit Launch buttons — the most familiar of the three."],
      ["B","Ember", ember(),
       "Editorial. A display serif for names, warm near-black like ink on dark paper, rules instead of boxes, and a generous measure. The timer is set in the same serif and treated as part of the page rather than a widget. Fewest affordances — you act on a row by clicking it."],
      ["C","Almanac", almanac(),
       "Technical and dense. Monospaced throughout, entirely achromatic, tight rows with a marker rather than a fill for the active workspace. Fits noticeably more on screen, which matters on your 1280×752 panel, and leans hardest on the constellations to carry identity."],
    ];
    out.innerHTML = items.map(([k,n,html,note])=>
      `<p class="caption"><b>${k}</b> &nbsp;·&nbsp; ${n}</p>${html}<p class="note">${note}</p>`).join("");
  </script>
</body>
