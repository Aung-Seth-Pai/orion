[package]
name = "orion"
version = "0.2.0"
description = "Orion - Windows productivity cockpit"
edition = "2021"

[lib]
name = "orion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
# --- Local semantic search (Phase 1) -----------------------------------------
# sqlite-vec compiles into the binary and registers against rusqlite's own
# bundled SQLite, so there is no loadable extension file to ship per platform.
sqlite-vec = "0.1.9"
# candle runs the embedding model on the CPU in pure Rust — no ONNX Runtime
# DLL to bundle and no Python. Default features are CPU-only.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# Pinned to the version candle-core already pulls so it is compiled once.
# fancy-regex keeps the regex engine pure Rust instead of building Oniguruma.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# Already in the tree via tauri-plugin-updater; declared here so the model
# downloader can use it without adding a second HTTP/TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"

[profile.release]
# Deliberately NOT panic = "abort". candle panics on tensor shape mismatches,
# and embedding now sits in the hot path behind every save and every /ai query.
# Aborting would take the whole app down instead of surfacing the error the
# embedding code already returns as an Err, and a release build cannot be
# tested for this because the test harness always unwinds.
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The app is built for size (opt-level = "s"), which is right for UI and SQL
# code but throttles the embedding maths: at "s" a rebuild of a ~90-item library
# takes ~16s, almost all of it in matrix multiplication. These few crates are the
# hot path, so they are compiled for speed instead. It costs a little binary size
# in exchange for a large speedup, and only applies to dependencies — Orion's own
# code stays optimised for size.
[profile.release.package.candle-core]
opt-level = 3
[profile.release.package.candle-nn]
opt-level = 3
[profile.release.package.candle-transformers]
opt-level = 3
[profile.release.package.gemm]
opt-level = 3
[profile.release.package.gemm-common]
opt-level = 3
[profile.release.package.gemm-f32]
opt-level = 3
[profile.release.package.gemm-f16]
opt-level = 3
[profile.release.package.pulp]
opt-level = 3
[profile.release.package.half]
opt-level = 3
